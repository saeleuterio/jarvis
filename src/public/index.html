<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S.</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="interface">

        <header>

            <div class="logo">
                J.A.R.V.I.S.
            </div>

            <div class="status">
                ● ONLINE
            </div>

        </header>

        <main>

            <div class="orb">
                <div class="orb-core"></div>
            </div>

            <div class="greeting">

                <h1>
                    Bom dia, senhor Saulo.
                </h1>

                <p>
                    Sistema JARVIS inicializado.
                </p>

            </div>

            <div
                id="chat"
                class="chat"
            ></div>

        </main>

        <footer>

            <input
                id="mensagem"
                type="text"
                placeholder="Fale com o JARVIS..."
                autocomplete="off"
            >

            <button id="enviar">
                ENVIAR
            </button>

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
